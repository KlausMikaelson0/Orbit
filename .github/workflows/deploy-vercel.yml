name: Deploy Orbit Web (Vercel)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Ensure Vercel token is configured
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "Missing VERCEL_TOKEN secret."
            echo "Set VERCEL_TOKEN in GitHub > Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "Missing VERCEL_ORG_ID or VERCEL_PROJECT_ID secrets."
            echo "Set both secrets from your Vercel project settings."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run quality gates
        run: npm run lint && npm run build

      - name: Pull Vercel production config
        run: npx -y vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy to Vercel production
        run: npx -y vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
